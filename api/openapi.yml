openapi: 3.0.3
info:
  title: LEIA Runner API
  description: API for running LEIA sessions, generation helpers, cache operations, and internal runner utilities.
  version: '1.0.0'
servers:
  - url: /api
    description: Local server
  - url: https://customer-leia-c532b43c578c.herokuapp.com/api
    description: Production server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []

tags:
  - name: Leias v1
    description: LEIA runtime session endpoints
  - name: MultiLEIA v1
    description: Deterministic text-only multi-agent runtime endpoints
  - name: Models v1
    description: Available model endpoints
  - name: Evaluation v1
    description: Student solution evaluation endpoints
  - name: Cache v1
    description: Runner cache management endpoints
  - name: Transcriptions v1
    description: Transcription generation endpoints
  - name: Generation v1
    description: Problem and behaviour generation endpoints
  - name: Problem Chat v1
    description: Design-time problem chat assistant endpoints
  - name: Supervisor v1
    description: Background activity supervision endpoints
  - name: API Keys v1
    description: Internal API key cache endpoints

paths:
  /v1/leias:
    $ref: './paths/v1/leias/index.yaml'
  /v1/leias/{sessionId}/messages:
    $ref: './paths/v1/leias/_sessionId-messages.yaml'
  /v1/multi-leias:
    $ref: './paths/v1/multi-leias/index.yaml'
  /v1/multi-leias/{sessionId}:
    $ref: './paths/v1/multi-leias/_sessionId.yaml'
  /v1/multi-leias/{sessionId}/messages:
    $ref: './paths/v1/multi-leias/_sessionId-messages.yaml'
  /v1/multi-leias/{sessionId}/messages/stream:
    $ref: './paths/v1/multi-leias/_sessionId-messages-stream.yaml'
  /v1/models:
    $ref: './paths/v1/models/index.yaml'
  /v1/evaluation:
    $ref: './paths/v1/evaluation/index.yaml'
  /v1/cache/purge:
    $ref: './paths/v1/cache/purge.yaml'
  /v1/cache/stats:
    $ref: './paths/v1/cache/stats.yaml'
  /v1/transcriptions/generate:
    $ref: './paths/v1/transcriptions/generate.yaml'
  /v1/problems/generate:
    $ref: './paths/v1/problems/generate.yaml'
  /v1/behaviours/generate:
    $ref: './paths/v1/behaviours/generate.yaml'
  /v1/problems/chat/session:
    $ref: './paths/v1/problem-chat/session.yaml'
  /v1/problems/chat/{chatId}/files:
    $ref: './paths/v1/problem-chat/_chatId-files.yaml'
  /v1/problems/chat/{chatId}/messages:
    $ref: './paths/v1/problem-chat/_chatId-messages.yaml'
  /v1/supervisor:
    $ref: './paths/v1/supervisor/index.yaml'
  /v1/revoke:
    $ref: './paths/v1/apikeys/revoke.yaml'
