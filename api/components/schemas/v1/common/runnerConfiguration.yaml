type: object
properties:
  provider:
    type: string
    description: Provider module, as listed by GET /v1/models (openai-responses, gemini-3.1-flash-lite-preview, ollama, alma).
    example: openai-responses
  modelName:
    type: string
    example: gpt-4o-mini
  apiKeyId:
    type: string
    example: 64f8a62fd2f4b7c7c5b8a123
  apiKeyRequesterId:
    type: string
    example: 64f8a62fd2f4b7c7c5b8a456
  lukeConfig:
    $ref: './lukeConfig.yaml'
description: Runtime model and API key configuration.
