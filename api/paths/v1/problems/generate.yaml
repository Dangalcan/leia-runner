post:
  tags:
    - Generation v1
  operationId: generateProblem
  summary: Generate a problem from an example
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/v1/generation/problemGenerateRequest.yaml'
  responses:
    '200':
      description: Problem generated successfully.
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/v1/generation/generateResponse.yaml'
    '400':
      description: subject or exampleProblem is missing.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
            required:
              - error
          examples:
            subjectRequired:
              summary: Subject is missing
              value:
                error: Subject is required
            exampleProblemRequired:
              summary: Example problem is missing
              value:
                error: Example problem is required
    '401':
      description: Unauthorized.
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/v1/common/authError.yaml'
    '500':
      description: Internal server error or provider configuration error.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              message:
                type: string
            required:
              - error
          examples:
            providerConfigurationError:
              summary: AI provider configuration error
              value:
                error: AI provider configuration error
            generationFailed:
              summary: Problem generation failed
              value:
                error: Failed to generate problem
                message: Unexpected error message
